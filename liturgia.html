<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liturgia del Giorno</title>
  <style>
    /* Reset di base e font */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    /* Navbar */
    .navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar .logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: #2c3e50;
      text-decoration: none;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #555;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #0056b3;
    }

    /* Layout Pagina Liturgia */
    .liturgia-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1rem;
    }
    .liturgia-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .liturgia-header h1 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }
    .liturgia-header p {
      color: #666;
      font-size: 1.1rem;
    }

    /* Griglia Widget */
    .liturgia-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      align-items: start;
    }

    /* Card per ciascun Widget */
    .liturgia-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef2f5;
    }
    .liturgia-card h2 {
      font-size: 1.3rem;
      color: #1a252f;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #eef2f5;
    }

    /* Adattamento Widget Esterni */
    .widget-wrapper {
      width: 100%;
      overflow-x: auto;
    }
    .widget-wrapper iframe,
    .widget-wrapper div {
      max-width: 100% !important;
      width: 100% !important;
      box-sizing: border-box;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 3rem;
      background-color: #ffffff;
      border-top: 1px solid #eef2f5;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Menu di Navigazione -->
  <nav class="navbar">
    <a href="index.html" class="logo">Mio Sito</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="chi-siamo.html">Chi Siamo</a></li>
      <li><a href="liturgia.html" class="active">Liturgia</a></li>
      <li><a href="contatti.html">Contatti</a></li>
    </ul>
  </nav>

  <!-- Contenuto Principale -->
  <main class="liturgia-container">
    <header class="liturgia-header">
      <h1>Liturgia del Giorno</h1>
      <p>Almanacco liturgico, letture e Vangelo quotidiano</p>
    </header>

    <div class="liturgia-grid">
      <!-- Primo Widget: Almanacco -->
      <section class="liturgia-card">
        <h2>Almanacco e Letture</h2>
        <div class="widget-wrapper">
          <script src='https://widgets.chiesacattolica.it/widget-almanacco-v2/widget.php?mods=435361&font=16&colors=1' async></script>
        </div>
      </section>

      <!-- Secondo Widget: Vangelo del Giorno -->
      <section class="liturgia-card">
        <h2>Vangelo del Giorno</h2>
        <div class="widget-wrapper">
          <script src='https://widgets.chiesacattolica.it/widget-almanacco-v2/widget-vangelodelgiorno.php' async></script>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 - Tutti i diritti riservati</p>
  </footer>

</body>
</html>
